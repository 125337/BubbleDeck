name: Build BubbleDeck

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Theos
      uses: Randomblock1/theos-action@v1

    - name: Build dylib (arm64)
      run: |
        set -o pipefail

        rm -rf build_bd/
        mkdir -p build_bd

        SDK_PATH=$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk | sort -V | tail -1)
        echo "Using SDK: $SDK_PATH"

        # 自动发现根目录下所有 .m 源文件（新增文件无需修改本 workflow；排除 .github）
        find . -name '*.m' -type f -not -path './.github/*' | sort | while read -r f; do
          # 对象文件带路径哈希，避免不同目录同名 .m 互相覆盖
          OBJ_FILE="build_bd/$(echo "$f" | md5sum | cut -c1-8)_$(basename "$f" .m).o"
          echo "Compiling: $f -> $OBJ_FILE"
          clang -arch arm64 \
                -isysroot "$SDK_PATH" \
                -target arm64-apple-ios14.0 \
                -c \
                -fobjc-arc \
                -Oz \
                -Wno-deprecated-declarations \
                -Wno-unused-function \
                -Wno-unused-variable \
                -I. \
                -Ilibs \
                -ICore \
                -IEngine \
                -IEntry \
                -o "$OBJ_FILE" \
                "$f" || { echo "FAILED: $f"; exit 1; }
        done

        echo "=== Link all .o into dylib ==="
        # -undefined dynamic_lookup（Theos 标准做法）：微信注入时解析符号，无需链 Framework
        clang -arch arm64 \
              -isysroot "$SDK_PATH" \
              -target arm64-apple-ios14.0 \
              -dynamiclib \
              -undefined dynamic_lookup \
              -Wl,-S \
              -Wl,-x \
              -o build_bd/BubbleDeck.dylib \
              build_bd/*.o

        echo "=== Build successful ==="
        ls -la build_bd/BubbleDeck.dylib

    - name: Sign dylib (ldid 伪签名)
      run: |
        ldid -S build_bd/BubbleDeck.dylib
        ldid build_bd/BubbleDeck.dylib

    - name: Delete old artifacts
      uses: actions/github-script@v9
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          for (const artifact of artifacts.data.artifacts) {
            if (artifact.name === 'BubbleDeck.dylib') {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted old artifact: ${artifact.name} (id: ${artifact.id})`);
            }
          }
        # 旧制品删除失败不阻塞（首次运行为空）

    - name: Upload dylib
      uses: actions/upload-artifact@v7
      with:
        name: BubbleDeck.dylib
        path: |
          build_bd/BubbleDeck.dylib
        retention-days: 30

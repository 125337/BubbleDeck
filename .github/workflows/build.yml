name: Build BubbleDeck

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 钉 24.04：ubuntu-latest 已切 26.04，theos-action 的 apt 依赖（libxml2）装不上
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Refresh apt index
      run: sudo apt-get update

    - name: Setup Theos
      uses: Randomblock1/theos-action@v1

    - name: Build dylib (arm64)
      run: |
        set -o pipefail

        rm -rf build_bd/
        mkdir -p build_bd

        SDK_PATH=$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk | sort -V | tail -1)
        echo "Using SDK: $SDK_PATH"

        # 必须用 Theos 工具链的 clang：链接时它会自动调同目录的 Apple ld64（Mach-O）。
        # 系统 clang 链接会调 /usr/bin/ld（GNU ELF ld），报 "unrecognized emulation mode: LLVM"
        TC="$THEOS/toolchain/linux/iphone/bin"
        [ -x "$TC/clang" ] || TC="$(dirname "$(command -v clang)")"
        CLANG="$TC/clang"
        echo "Using clang: $CLANG"

        # 自动发现根目录下所有 .m 源文件（新增文件无需修改本 workflow）
        # 排除 .github 与 ./theos（theos-action 把 Theos 装在仓库目录里）
        find . -name '*.m' -type f -not -path './.github/*' -not -path './theos/*' | sort | while read -r f; do
          # 对象文件带路径哈希，避免不同目录同名 .m 互相覆盖
          OBJ_FILE="build_bd/$(echo "$f" | md5sum | cut -c1-8)_$(basename "$f" .m).o"
          echo "Compiling: $f -> $OBJ_FILE"
          "$CLANG" -arch arm64 \
                -isysroot "$SDK_PATH" \
                -target arm64-apple-ios14.0 \
                -c \
                -fobjc-arc \
                -Oz \
                -Wno-deprecated-declarations \
                -Wno-unused-function \
                -Wno-unused-variable \
                -I. \
                -Ilibs \
                -ICore \
                -IEngine \
                -IEntry \
                -o "$OBJ_FILE" \
                "$f" || { echo "FAILED: $f"; exit 1; }
        done

        echo "=== Link all .o into dylib ==="
        # -undefined dynamic_lookup（Theos 标准做法）：微信注入时解析符号，无需链 Framework
        "$CLANG" -arch arm64 \
              -isysroot "$SDK_PATH" \
              -target arm64-apple-ios14.0 \
              -dynamiclib \
              -undefined dynamic_lookup \
              -Wl,-S \
              -Wl,-x \
              -o build_bd/BubbleDeck.dylib \
              build_bd/*.o

        echo "=== Build successful ==="
        ls -la build_bd/BubbleDeck.dylib

    - name: Sign dylib (ldid 伪签名)
      run: |
        # ubuntu 源没有 ldid 包，用 ProcursusTeam 官方预编译 Linux 版
        curl -fsSL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
        chmod +x /tmp/ldid
        sudo mv /tmp/ldid /usr/local/bin/ldid
        ldid -S build_bd/BubbleDeck.dylib
        ldid build_bd/BubbleDeck.dylib || true  # 打印签名信息，非致命

    - name: Delete old artifacts
      uses: actions/github-script@v9
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          for (const artifact of artifacts.data.artifacts) {
            if (artifact.name === 'BubbleDeck.dylib') {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted old artifact: ${artifact.name} (id: ${artifact.id})`);
            }
          }
        # 旧制品删除失败不阻塞（首次运行为空）

    - name: Upload dylib
      uses: actions/upload-artifact@v7
      with:
        name: BubbleDeck.dylib
        path: |
          build_bd/BubbleDeck.dylib
        retention-days: 30

{% extends "biz/m/base.html" %}
{% block content %}

<section class="sect">
  <h2>修改登录密码</h2>
  <div class="bcard">
    <form id="pwform" class="fgrid" enctype="multipart/form-data" onsubmit="return false">
      <div class="fld"><label for="pw-old">当前密码</label>
        <input id="pw-old" type="password" autocomplete="current-password"></div>
      <div class="fld"><label for="pw-new">新密码</label>
        <input id="pw-new" type="password" autocomplete="new-password" placeholder="6-64 位"></div>
      <div class="fld"><label for="pw-confirm">确认新密码</label>
        <input id="pw-confirm" type="password" autocomplete="new-password"></div>
      <button type="submit" class="btn wfull" id="pwbtn">确认修改</button>
    </form>
    <p class="dim" style="font-size:12px;margin-top:8px">修改后请用新密码重新登录，旧会话不会立即失效。</p>
  </div>
</section>
{% endblock %}

{% block script %}
<script src="/admin/static/admin.js"></script>
<script>
  document.getElementById('pwform').addEventListener('submit', function (e) {
    e.preventDefault();
    var old = document.getElementById('pw-old').value,
        neu = document.getElementById('pw-new').value,
        conf = document.getElementById('pw-confirm').value;
    if (neu.length < 6 || neu.length > 64) { BD.toast('⚠ 新密码长度需在 6-64 位之间'); return; }
    if (neu !== conf) { BD.toast('⚠ 两次输入的新密码不一致'); return; }
    if (neu === old) { BD.toast('⚠ 新密码不能与当前密码相同'); return; }
    var btn = document.getElementById('pwbtn');
    btn.disabled = true;
    BD.api('/biz/api/password', { old: old, new: neu }).then(function (j) {
      btn.disabled = false;
      if (j.code !== 0) { BD.toast('⚠ ' + j.msg); return; }
      BD.toast(j.msg);
      document.getElementById('pw-old').value = '';
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-confirm').value = '';
    });
  });
</script>
{% endblock %}

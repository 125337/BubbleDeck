<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>登录 · BubbleDeck</title>
<style>
:root{
  --paper:#f4f2ee; --surface:#ffffff; --ink:#17161b; --ink-2:#65636c; --ink-3:#98959d;
  --hair:#e3dfd9; --accent:#4a4ab0; --bad:#b03a3a; --bad-soft:#fbeeee;
  --r1:6px; --r2:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  font-size:14px;-webkit-font-smoothing:antialiased;
  background-image:repeating-linear-gradient(90deg,transparent 0 79px,rgba(23,22,27,.035) 79px 80px)}
.card{width:360px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r2);
  padding:40px 34px 34px;position:relative;
  box-shadow:0 1px 2px rgba(23,22,27,.04),0 18px 48px rgba(23,22,27,.07);
  animation:rise .4s cubic-bezier(.2,1,.35,1) both}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,#5f5fc7,#8a5ff0);border-radius:var(--r2) var(--r2) 0 0}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.brand{display:flex;flex-direction:column;align-items:center;gap:11px;margin-bottom:32px}
.mark{width:38px;height:38px;border-radius:var(--r1);background:linear-gradient(145deg,#5f5fc7,#8a5ff0);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--ink-3);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.err{background:var(--bad-soft);border:1px solid #efd5d5;color:var(--bad);font-size:12px;
  padding:9px 12px;border-radius:var(--r1);margin-bottom:16px;text-align:center;animation:shake .32s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
label{display:block;font-size:11px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:7px}
input{width:100%;height:40px;padding:0 12px;border:1px solid var(--hair);border-radius:var(--r1);
  font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#a9a7d8;box-shadow:0 0 0 3px rgba(74,74,176,.09)}
button{width:100%;height:42px;margin-top:22px;border:0;border-radius:var(--r1);cursor:pointer;
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;font-family:inherit;
  transition:background .15s}
button:hover{background:#2b2931}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark">B</span><b>BubbleDeck</b><span>授权管理</span></div>
  {% if err %}<div class="err" role="alert">{{ err }}</div>{% endif %}
  <form method="post" action="/admin/login" enctype="multipart/form-data">
    <label for="p">管理密码</label>
    <input id="p" type="password" name="pass" placeholder="请输入密码" autofocus required autocomplete="current-password">
    <button type="submit">登 录</button>
  </form>
</div>
<script>
/* 错误提示只显示一次：剥掉 ?msg= 防刷新复现 */
try{var u=new URL(location.href);if(u.searchParams.has('msg')){u.searchParams.delete('msg');
history.replaceState(null,'',u.pathname+u.search)}}catch(e){}
</script>
</body>
</html>
